<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de PFC</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Sistema de Apoio Bibliográfico para PFCs</h1>

        <h2>Cadastro do Projeto de Final de Curso</h2>

        <form id="formPfc">

            <label>Nome do aluno:</label>
            <input type="text" id="nome_aluno" required>

            <label>Curso:</label>
            <input type="text" id="curso" required>

            <label>Disciplina:</label>
            <input type="text" id="disciplina" required>

            <label>Tema do PFC:</label>
            <input type="text" id="tema" required>

            <label>Área de conhecimento:</label>
            <input type="text" id="area_conhecimento" required>

            <label>Palavras-chave:</label>
            <input type="text" id="palavras_chave" required>

            <button type="submit">Cadastrar PFC</button>

        </form>

        <p id="mensagem"></p>

    </div>

    <script src="script.js"></script>

</body>

</html>
